<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Batman: Streets of Gotham</title>
    <!-- Add WASD key mapping script before loading the game -->
    <script>
      // This script adds WASD key support by simulating arrow key events
      document.addEventListener('DOMContentLoaded', function () {
        // Key mapping: WASD to Arrow keys
        const keyMap = {
          KeyW: 'ArrowUp',
          KeyA: 'ArrowLeft',
          KeyD: 'ArrowRight',
          KeyS: 'ArrowDown',
        };

        // Add key event listeners
        document.addEventListener('keydown', function (e) {
          // Check if the pressed key is in our map
          if (keyMap[e.code]) {
            // Create a new keyboard event for the corresponding arrow key
            const arrowEvent = new KeyboardEvent('keydown', {
              code: keyMap[e.code],
              key: keyMap[e.code],
              keyCode:
                keyMap[e.code] === 'ArrowUp'
                  ? 38
                  : keyMap[e.code] === 'ArrowDown'
                  ? 40
                  : keyMap[e.code] === 'ArrowLeft'
                  ? 37
                  : 39,
              which:
                keyMap[e.code] === 'ArrowUp'
                  ? 38
                  : keyMap[e.code] === 'ArrowDown'
                  ? 40
                  : keyMap[e.code] === 'ArrowLeft'
                  ? 37
                  : 39,
              bubbles: true,
            });

            // Dispatch the arrow key event
            document.dispatchEvent(arrowEvent);
          }
        });

        document.addEventListener('keyup', function (e) {
          // Check if the released key is in our map
          if (keyMap[e.code]) {
            // Create a new keyboard event for the corresponding arrow key
            const arrowEvent = new KeyboardEvent('keyup', {
              code: keyMap[e.code],
              key: keyMap[e.code],
              keyCode:
                keyMap[e.code] === 'ArrowUp'
                  ? 38
                  : keyMap[e.code] === 'ArrowDown'
                  ? 40
                  : keyMap[e.code] === 'ArrowLeft'
                  ? 37
                  : 39,
              which:
                keyMap[e.code] === 'ArrowUp'
                  ? 38
                  : keyMap[e.code] === 'ArrowDown'
                  ? 40
                  : keyMap[e.code] === 'ArrowLeft'
                  ? 37
                  : 39,
              bubbles: true,
            });

            // Dispatch the arrow key event
            document.dispatchEvent(arrowEvent);
          }
        });
      });
    </script>
    <script src="game.js"></script>
  </head>
  <body></body>
</html>
